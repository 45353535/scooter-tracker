name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Setup
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build
        continue-on-error: true
        run: |
          echo "=== PATH check ===" > debug.txt
          echo "$PATH" >> debug.txt
          echo "=== which gradle ===" >> debug.txt
          (which gradle || echo "NOT FOUND") >> debug.txt 2>&1
          echo "=== gradle version ===" >> debug.txt
          (gradle --version || echo "VERSION FAILED") >> debug.txt 2>&1
          echo "=== ANDROID_HOME ===" >> debug.txt
          echo "$ANDROID_HOME" >> debug.txt
          echo "=== local.properties ===" >> debug.txt
          cat local.properties >> debug.txt
          echo "=== build ===" >> debug.txt
          gradle assembleDebug --no-daemon --stacktrace >> debug.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-output
          path: debug.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scooter-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
