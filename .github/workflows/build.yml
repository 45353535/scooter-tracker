name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Setup SDK
        shell: bash
        run: |
          SDK=$ANDROID_HOME
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" --sdk_root=$SDK > /dev/null 2>&1 || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        id: build
        shell: bash
        run: |
          echo "pwd: $(pwd)" >> $GITHUB_STEP_SUMMARY
          echo "ls: $(ls -la)" >> $GITHUB_STEP_SUMMARY
          echo "gradle --version:" >> $GITHUB_STEP_SUMMARY
          gradle --version >> $GITHUB_STEP_SUMMARY 2>&1
          echo "Building..." >> $GITHUB_STEP_SUMMARY
          gradle assembleDebug --no-daemon --stacktrace >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scooter-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
