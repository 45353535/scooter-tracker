name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-install
          echo "/tmp/gradle-install/gradle-8.5/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=/tmp/gradle-install/gradle-8.5" >> $GITHUB_ENV

      - name: Build APK
        continue-on-error: true
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload debug log
        if: always()
        run: |
          echo "=== PATH ===" > /tmp/debug.txt
          echo "$PATH" >> /tmp/debug.txt
          echo "=== JAVA ===" >> /tmp/debug.txt
          java -version 2>&1 >> /tmp/debug.txt
          echo "=== ANDROID_HOME ===" >> /tmp/debug.txt
          ls -la $ANDROID_HOME 2>&1 >> /tmp/debug.txt
          echo "=== SDK ===" >> /tmp/debug.txt
          ls -la $ANDROID_HOME/platforms/ 2>&1 >> /tmp/debug.txt
          echo "=== local.properties ===" >> /tmp/debug.txt
          cat local.properties >> /tmp/debug.txt
          echo "=== build.log ===" >> /tmp/debug.txt
          cat /tmp/build.log >> /tmp/debug.txt 2>&1 || echo "no build log" >> /tmp/debug.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-output
          path: /tmp/debug.txt
