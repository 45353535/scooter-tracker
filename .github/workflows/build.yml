name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.5

      - name: Build APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload debug
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Build log $(date)" \
            --body "$(cat /tmp/build.log)"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scooter-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
