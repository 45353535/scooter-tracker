name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Debug
        if: failure()
        run: |
          echo "::warning::=== ERROR LINES ==="
          grep -A3 "e:\|FAILED\|error:\|What went wrong\|BUILD FAILED" /tmp/build.log 2>/dev/null | head -30 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          echo "::warning::=== LAST 20 ==="
          tail -20 /tmp/build.log 2>/dev/null | while IFS= read -r line; do
            echo "::warning::$line"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scooter-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
