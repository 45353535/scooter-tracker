name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" | tee /tmp/env.txt
          ls -la $ANDROID_HOME/platforms/ 2>&1 | tee -a /tmp/env.txt
          ls -la $ANDROID_HOME/build-tools/ 2>&1 | tee -a /tmp/env.txt
          echo "JAVA_HOME=$JAVA_HOME" | tee -a /tmp/env.txt
          java -version 2>&1 | tee -a /tmp/env.txt

      - name: Build APK
        id: build
        run: |
          # Save full output
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show error on fail
        if: failure()
        run: |
          echo "::warning::Total lines: $(wc -l < /tmp/build.log 2>/dev/null || echo 0)"
          echo "::warning::=== ERROR/FAILURE LINES ==="
          grep -in "FAILED\|ERROR\|[Cc]ause\|Exception\|BUILD" /tmp/build.log 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::warning::$line"
          done
          echo "::warning::=== LAST 20 LINES ==="
          tail -20 /tmp/build.log 2>/dev/null | while IFS= read -r line; do
            echo "::warning::$line"
          done
          echo "::warning::=== PASTEBIN ==="
          pbin=$(curl -s -F 'f:1=<-' ix.io < /tmp/build.log 2>/dev/null)
          echo "::warning::Full log: $pbin"
