name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Check SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ || echo "no ANDROID_HOME"
          which sdkmanager || echo "no sdkmanager"
          sdkmanager --list 2>/dev/null | head -5 || echo "sdkmanager failed"

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build APK
        run: |
          echo "=== gradle check ==="
          which gradle || echo "gradle not in PATH"
          gradle --version || echo "gradle failed"
          echo "=== start build ==="
          gradle assembleDebug --no-daemon --stacktrace
