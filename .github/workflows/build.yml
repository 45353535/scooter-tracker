name: Build APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        continue-on-error: true
        id: build
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Debug
        if: always()
        run: |
          wc -l /tmp/build.log
          grep -A2 "e:\|Error\|error:" /tmp/build.log 2>/dev/null | head -20
          echo "---last 30---"
          tail -30 /tmp/build.log 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scooter-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
